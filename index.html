<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="CVS Health internal multi-agent analytics copilot for Snowflake and MicroStrategy." />
    <title>Analytics Copilot | CVS Health</title>
    <link rel="icon" type="image/svg+xml" href="/brand/cvs-heart.svg" />
    <script>
      // Applied before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('cvs-assistant:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var s = localStorage.getItem('cvs-assistant:text-size');
          if (s) document.documentElement.dataset.textSize = s;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
